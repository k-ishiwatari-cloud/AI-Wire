<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="description" content="AI 関連ニュースを、出典へのリンク付きで短く要約した速報の一覧です。">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="https://ai-wire.site/news">

<link rel="stylesheet" href="/style.css">

<body>

<div class="app">
  <aside class="rail">
    <div class="rail-top">
      <a class="wordmark" href="/"><img class="wordmark-mark" src="/favicon.svg" alt="" width="28" height="28">AI<span>WIRE</span></a>

      <p class="meta">最終更新 <!-- build:last-updated --><time id="last-updated">—</time><!-- /build:last-updated --></p>

    <nav class="filters" id="filters" aria-label="タグで絞り込み">
      <button class="filter-chip is-active" data-tag="__all__" type="button">すべて</button>
      <!-- build:filters --><!-- /build:filters -->
    </nav>
  </aside>

  <main class="feed-wrap">

    <!-- 最新のまとめと記事一覧はビルド時に scripts/render_site.py が書き出す -->
    <!-- build:roundup --><!-- /build:roundup -->
    <div class="feed" id="feed">
      <!-- build:feed --><!-- /build:feed -->
    </div>

    <footer class="site-footer">
      <a href="/about">AI WIRE について</a>
      <a href="/privacy">プライバシーポリシー</a>
